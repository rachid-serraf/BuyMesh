<button
  type="button"
  [class]="buttonClass()"
  [class.btn-icon]="iconOnly()"
  [class.is-added]="status() === 'added'"
  [class.is-error]="status() === 'error'"
  [disabled]="disabled() || isSeller()"
  [attr.aria-busy]="status() === 'loading'"
  [attr.aria-label]="ariaLabel()"
  [attr.title]="isSeller() ? 'Sellers cannot buy products' : status() === 'error' ? errorMessage() : null"
  (click)="add($event)"
  (keydown.enter)="$event.stopPropagation()"
>
  @if (isSeller()) {
    <lucide-angular [img]="ShoppingCart" [size]="18"></lucide-angular>
    @if (!iconOnly()) {
      Sellers can't buy
    }
  } @else {
    @switch (status()) {
      @case ('loading') {
        <span class="spinner" aria-hidden="true"></span>
        @if (!iconOnly()) {
          Adding…
        }
      }
      @case ('added') {
        <lucide-angular [img]="Check" [size]="18"></lucide-angular>
        @if (!iconOnly()) {
          Added
        }
      }
      @case ('error') {
        <lucide-angular [img]="CircleAlert" [size]="18"></lucide-angular>
        @if (!iconOnly()) {
          Not added
        }
      }
      @default {
        <lucide-angular [img]="ShoppingCart" [size]="18"></lucide-angular>
        @if (!iconOnly()) {
          Add to cart
        }
      }
    }
  }
</button>
