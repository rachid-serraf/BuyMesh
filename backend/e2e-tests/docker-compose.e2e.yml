x-mongo-health: &mongo-health
  test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
  interval: 5s
  timeout: 5s
  retries: 12

services:
  discovery-server:
    image: ${DISCOVERY_SERVER_IMAGE}
    build: ../backend/discovery-server
    environment:
      - TZ=${TZ}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xmx300m -XX:CICompilerCount=2
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - SPRING_JMX_ENABLED=false
    networks: [e2e]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.0}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms192m -Xmx256m"
      KAFKA_NUM_PARTITIONS: 1
    tmpfs:
      - /var/lib/kafka/data:mode=1777
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  mongo-user:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USER_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${USER_MONGO_PASSWORD}
    tmpfs: [/data/db]
    networks: [e2e]
    healthcheck: *mongo-health

  mongo-media:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${MEDIA_MONGO_DB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${MEDIA_MONGO_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MEDIA_MONGO_DB_PWD}
    tmpfs: [/data/db]
    networks: [e2e]
    healthcheck: *mongo-health

  mongo-product:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${PRODUCT_MONGO_DB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${PRODUCT_MONGO_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${PRODUCT_MONGO_DB_PWD}
    tmpfs: [/data/db]
    networks: [e2e]
    healthcheck: *mongo-health

  mongo-order:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${ORDER_MONGO_DB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${ORDER_MONGO_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${ORDER_MONGO_DB_PWD}
    tmpfs: [/data/db]
    networks: [e2e]
    healthcheck: *mongo-health

  user-service:
    image: ${USER_SERVICE_IMAGE}
    build: ../backend/user-service
    depends_on:
      mongo-user: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      - TZ=${TZ}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=http://discovery-server:8761/eureka
      - USER_MONGO_HOST=mongo-user
      - USER_MONGO_PORT=27017
      - USER_MONGO_DB=${USER_MONGO_DB}
      - USER_MONGO_USERNAME=${USER_MONGO_USERNAME}
      - USER_MONGO_PASSWORD=${USER_MONGO_PASSWORD}
      - KAFKA_BROKER=kafka:9092
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - MEDIA_SERVICE_URL=http://media-service:8083
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xmx300m -XX:CICompilerCount=2
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - SPRING_JMX_ENABLED=false
    tmpfs: [/app/uploads/avatars]
    networks: [e2e]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${USER_SERVICE_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  product-service:
    image: ${PRODUCT_SERVICE_IMAGE}
    build: ../backend/product-service
    depends_on:
      user-service: { condition: service_healthy }
      mongo-product: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      - TZ=${TZ}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=http://discovery-server:8761/eureka
      - PRODUCT_MONGO_HOST=mongo-product
      - PRODUCT_MONGO_LOCAL_PORT=27017
      - PRODUCT_MONGO_DB_NAME=${PRODUCT_MONGO_DB_NAME}
      - PRODUCT_MONGO_DB_USER=${PRODUCT_MONGO_DB_USER}
      - PRODUCT_MONGO_DB_PWD=${PRODUCT_MONGO_DB_PWD}
      - KAFKA_BROKER=kafka:9092
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xmx300m -XX:CICompilerCount=2
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - SPRING_JMX_ENABLED=false
    networks: [e2e]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  media-service:
    image: ${MEDIA_SERVICE_IMAGE}
    build: ../backend/media-service
    depends_on:
      product-service: { condition: service_healthy }
      mongo-media: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      - TZ=${TZ}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=http://discovery-server:8761/eureka
      - MEDIA_MONGO_HOST=mongo-media
      - MEDIA_MONGO_LOCAL_PORT=27017
      - MEDIA_MONGO_DB_NAME=${MEDIA_MONGO_DB_NAME}
      - MEDIA_MONGO_DB_USER=${MEDIA_MONGO_DB_USER}
      - MEDIA_MONGO_DB_PWD=${MEDIA_MONGO_DB_PWD}
      - KAFKA_BROKER=kafka:9092
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - UPLOAD_DIR=/app/uploads/media
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xmx300m -XX:CICompilerCount=2
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - SPRING_JMX_ENABLED=false
    tmpfs: [/app/uploads/media]
    networks: [e2e]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  order-service:
    image: ${ORDER_SERVICE_IMAGE}
    build: ../backend/order-service
    depends_on:
      media-service: { condition: service_healthy }
      mongo-order: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      - TZ=${TZ}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=http://discovery-server:8761/eureka
      - ORDER_MONGO_HOST=mongo-order
      - ORDER_MONGO_LOCAL_PORT=27017
      - ORDER_MONGO_DB_NAME=${ORDER_MONGO_DB_NAME}
      - ORDER_MONGO_DB_USER=${ORDER_MONGO_DB_USER}
      - ORDER_MONGO_DB_PWD=${ORDER_MONGO_DB_PWD}
      - KAFKA_BROKER=kafka:9092
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - MEDIA_SERVICE_URL=http://media-service:8083
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xmx300m -XX:CICompilerCount=2
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - SPRING_JMX_ENABLED=false
    networks: [e2e]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  api-gateway:
    image: ${API_GATEWAY_IMAGE}
    build:
      context: ../backend/api-gateway
      dockerfile: Dockerfile
      args:
        SSL_PASSWORD: ${SSL_PASSWORD}
    depends_on:
      user-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      media-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
    environment:
      - TZ=${TZ}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=http://discovery-server:8761/eureka
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - SSL_PASSWORD=${SSL_PASSWORD}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED}
      - RATE_LIMIT_CAPACITY=${RATE_LIMIT_CAPACITY}
      - RATE_LIMIT_REFILL_MINUTES=${RATE_LIMIT_REFILL_MINUTES}
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xmx300m -XX:CICompilerCount=2
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - SPRING_JMX_ENABLED=false
    ports:
      - "127.0.0.1:${E2E_GATEWAY_PORT:-18080}:8080"   # the ONLY published port
    networks: [e2e]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # Only started with: --profile ui (Playwright later)
  frontend:
    profiles: ["ui"]
    build: ../frontend
    depends_on:
      api-gateway: { condition: service_healthy }
    ports:
      - "127.0.0.1:${E2E_FRONTEND_PORT:-18085}:80"
    networks: [e2e]

networks:
  e2e:
    driver: bridge